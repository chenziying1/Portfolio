<footer class="site-footer">
  <div class="footer-wrapper">
    <div class="footer-info">
      <p>如需转载，请注明出处，并在文章末尾附上本站链接，谢谢！</p>
      <p>作者邮箱：{{ site.email }}</p>
    </div>
    <div class="footer-social">
      <h4>其他关联</h4>
      <ul class="social-media-list">
        {%- if site.github_username -%}
        <li>
          <a href="https://github.com/{{ site.github_username }}">
            <svg class="svg-icon">
              <use xlink:href="{{ '/assets/minima-social-icons.svg#github' | relative_url }}"></use>
            </svg>
            <span class="username">{{ site.github_username }}</span>
          </a>
        </li>
        {%- endif -%}
        {%- if site.gitee_username -%}
        <li>
          <a href="https://gitee.com/{{ site.gitee_username }}">
            <img src="https://img.shields.io/badge/-Gitee-C71D23?style=for-the-badge&logo=gitee&logoColor=white" alt="Gitee">
            <span class="username">{{ site.gitee_username }}</span>
          </a>
        </li>
        {%- endif -%}
      </ul>
    </div>
  </div>
</footer>
